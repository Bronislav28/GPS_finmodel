sga:
  currency: RUB
  description: >
    SG&A — постоянные административные расходы GPS.
    Расчет: gross salary + annual bonus + social contribution (SFR).
  inflation_driver: inflation_assumptions.rub_inflation
  payroll_assumptions:
    annual_bonus_percent_of_gross:
      value: 0.20
    social_contribution_sfr_percent_of_gross:
      source: finance.taxes.social_contribution_sfr_percent_of_gross
  roles:
    corporate_management:
      ceo_gm:
        salary_gross_monthly_rub_2026: 1200000
        fte_plan:
          - start_year: 2026
            start_month: 10
            fte: 1
      cfo_finance_controller:
        salary_gross_monthly_rub_2026: 800000
        fte_plan:
          - start_year: 2026
            start_month: 10
            fte: 1
      coo_operations:
        salary_gross_monthly_rub_2026: 800000
        fte_plan:
          - start_year: 2026
            start_month: 10
            fte: 1
      legal_support:
        salary_gross_monthly_rub_2026: 500000
        fte_plan:
          - start_year: 2026
            start_month: 10
            fte: 1
      compliance_regulatory_support:
        salary_gross_monthly_rub_2026: 500000
        fte_plan:
          - start_year: 2026
            start_month: 10
            fte: 1
    hr:
      hrbp:
        salary_gross_monthly_rub_2026: 350000
        fte_plan:
          - start_year: 2026
            start_month: 10
            fte: 1
      recruiter:
        salary_gross_monthly_rub_2026: 300000
        fte_plan:
          - start_year: 2026
            start_month: 10
            fte: 1
    finance_and_accounting:
      accounting:
        salary_gross_monthly_rub_2026: 300000
        fte_plan:
          - start_year: 2026
            start_month: 10
            fte: 1
      fpna:
        salary_gross_monthly_rub_2026: 400000
        fte_plan:
          - start_year: 2026
            start_month: 10
            fte: 1
    admin:
      procurement_support:
        salary_gross_monthly_rub_2026: 300000
        fte_plan:
          - start_year: 2026
            start_month: 10
            fte: 1
  calculation_logic:
    monthly_fte: >
      latest fte_plan.fte where fte_plan.start_year/start_month <= current month,
      otherwise 0
    salary_index_t: >
      cumulative inflation index from 2026 to current year
    monthly_gross_salary_by_role: salary_gross_monthly_rub_2026 * salary_index_t * monthly_fte
    monthly_bonus_by_role: monthly_gross_salary_by_role * annual_bonus_percent_of_gross
    monthly_social_contribution_sfr_by_role: (monthly_gross_salary_by_role + monthly_bonus_by_role) * finance.taxes.social_contribution_sfr_percent_of_gross
    monthly_fully_loaded_cost_by_role: monthly_gross_salary_by_role + monthly_bonus_by_role + monthly_social_contribution_sfr_by_role
    monthly_fixed_sga: sum(monthly_fully_loaded_cost_by_role)
    total_sga_fte: sum(monthly_fte across SG&A roles)
  office_rent:
    description: >
      Аренда офиса GPS рассчитывается исходя из численности сотрудников,
      норматива площади на 1 FTE и ставки аренды за 1 м2 в месяц.
    drivers:
      sqm_per_fte:
        value: 4
      rent_rub_per_sqm_per_month_base_2026:
        value: 3500
      inflation_driver: inflation_assumptions.rub_inflation
    calculation_logic:
      total_fte: core_team_fte + total_sga_fte
      required_office_area_sqm: total_fte * sqm_per_fte
      rent_rub_per_sqm_per_month_t: rent_rub_per_sqm_per_month_base_2026 * inflation_index_t
      monthly_office_rent: required_office_area_sqm * rent_rub_per_sqm_per_month_t
      annual_office_rent: monthly_office_rent * 12
  total_sga:
    formula: annual_fixed_sga + annual_office_rent

revenue:
  currency: RUB
  description: >
    Выручка GPS рассчитывается не через заранее заданную цену токена,
    а через целевую contribution margin к pricing base. Pricing base включает
    COGS и depreciation & amortization. SG&A не включается в pricing base
    и учитывается ниже в P&L.
  active_scenario: base
  target_contribution_margin:
    conservative:
      2026: 0.10
      2027: 0.15
      2028: 0.20
      2029: 0.25
      2030: 0.30
    base:
      2026: 0.15
      2027: 0.20
      2028: 0.25
      2029: 0.30
      2030: 0.35
    aggressive:
      2026: 0.20
      2027: 0.25
      2028: 0.30
      2029: 0.35
      2030: 0.40
  product_opex_allocation:
    method: token_share
    description: >
      Pricing base распределяется между продуктами пропорционально фактическому
      потреблению токенов по каждому продукту в соответствующем месяце.
  pricing_base:
    description: >
      База для расчета выручки и implied token price включает COGS и
      depreciation & amortization. SG&A не включается в pricing base.
    components:
      - total_cogs
      - total_depreciation_and_amortization
  products:
    workplace_ai:
      revenue_start:
        event_ref: capex.intangible_assets.products.workplace_ai.time_for_development.event_flag
        timing: after_event
    contact_center_ai:
      revenue_start:
        event_ref: capex.intangible_assets.products.contact_center_ai.time_for_development.event_flag
        timing: after_event
  calculation_logic:
    target_contribution_margin_t: target_contribution_margin[active_scenario][year]
    revenue_active_flag: 1 if month_key >= product.revenue_start_month_key else 0
    monthly_pricing_base: total_cogs + total_depreciation_and_amortization
    workplace_token_share: workplace_monthly_tokens / total_monthly_tokens
    contact_center_token_share: contact_center_monthly_tokens / total_monthly_tokens
    workplace_pricing_base: monthly_pricing_base * workplace_token_share
    contact_center_pricing_base: monthly_pricing_base * contact_center_token_share
    workplace_ai_revenue: workplace_pricing_base / (1 - target_contribution_margin_t) * workplace_ai.revenue_active_flag
    contact_center_ai_revenue: contact_center_pricing_base / (1 - target_contribution_margin_t) * contact_center_ai.revenue_active_flag
    total_revenue: workplace_ai_revenue + contact_center_ai_revenue
    workplace_implied_price_per_1m_tokens: workplace_ai_revenue / workplace_monthly_tokens * 1000000
    contact_center_implied_price_per_1m_tokens: contact_center_ai_revenue / contact_center_monthly_tokens * 1000000

pnl:
  currency: RUB
  description: >
    Profit & Loss model GPS. P&L строится на основе Revenue, COGS,
    SG&A, Depreciation & Amortization, interest expense и налога на прибыль.
  tax:
    profit_tax_rate:
      value: 0.25
  revenue_block:
    total_revenue: workplace_ai_revenue + contact_center_ai_revenue
  cogs_block:
    total_cogs: total_datacenter_opex + total_team_opex + annual_gpu_rental_cost
  gross_profit: total_revenue - total_cogs
  sga_block:
    total_sga:
      source: sga.total_sga
  ebitda: gross_profit - total_sga
  depreciation_and_amortization_block:
    total_ppe_depreciation:
      source: depreciation_and_amortization.total_ppe_depreciation
    total_ip_amortization:
      source: depreciation_and_amortization.total_ip_amortization
    total_depreciation_and_amortization:
      source: depreciation_and_amortization.total_depreciation_and_amortization
  ebit: ebitda - total_depreciation_and_amortization
  interest_expense:
    source: funding.interest_expense
  ebt: ebit - interest_expense
  profit_tax: max(ebt, 0) * profit_tax_rate
  net_income: ebt - profit_tax

cash_flow:
  currency: RUB
  description: >
    Cash Flow Statement GPS. Строится на основе P&L, CAPEX и Funding.
  opening_cash_balance:
    2026: 0
  operating_cash_flow:
    net_income:
      source: pnl.net_income
    depreciation_and_amortization:
      source: pnl.depreciation_and_amortization_block.total_depreciation_and_amortization
    operating_cash_flow: net_income + total_depreciation_and_amortization
  investing_cash_flow:
    gpu_infra_capex:
      source: capex.gpu_infra_capex
    datacenter_construction_capex:
      source: capex.datacenter_construction_capex
    office_capex:
      source: capex.total_office_capex
    intangible_capex:
      source: capex.intangible_capex
    investing_cash_flow: -gpu_infra_capex -datacenter_construction_capex -office_capex -intangible_capex
  pre_financing_cash_flow: operating_cash_flow + investing_cash_flow
  financing_cash_flow:
    equity_injection:
      source: funding.equity_injection
    revolver_drawdown:
      source: funding.revolver_drawdown
    revolver_repayment:
      source: funding.revolver_repayment
    financing_cash_flow: equity_injection + revolver_drawdown - revolver_repayment
  net_cash_flow: pre_financing_cash_flow + financing_cash_flow
  cash_balance:
    opening_cash: previous_year_closing_cash
    closing_cash: opening_cash + net_cash_flow
    cumulative_cash: cumulative_previous_year + net_cash_flow

funding:
  currency: RUB
  description: >
    Funding model GPS. Используется для покрытия отрицательного cash balance
    через equity, revolver или mix.
  active_scenario: mix
  scenarios:
    equity_only:
      equity_share:
        value: 1.0
      revolver_share:
        value: 0.0
    revolver_only:
      equity_share:
        value: 0.0
      revolver_share:
        value: 1.0
    mix:
      description: >
        Funding need покрывается комбинацией equity и revolver.
        Доли задаются пользователем вручную.
      equity_share:
        value: 0.5
      revolver_share:
        value: 0.5
      validation:
        formula: equity_share + revolver_share = 1.0
  revolver:
    interest_rate:
      source: finance.funding.revolver_interest_rate
  minimum_cash_balance:
    description: >
      Минимальный остаток денежных средств для операционной устойчивости.
      Рассчитывается как заданное количество месяцев фиксированных расходов GPS.
    months_of_fixed_costs:
      value: 1
    calculation_logic:
      monthly_fixed_costs: >
        monthly_team_opex + monthly_sga + monthly_gpu_rental_opex
      minimum_cash_balance: >
        monthly_fixed_costs * months_of_fixed_costs
  calculation_logic:
    closing_cash_before_funding: opening_cash + pre_financing_cash_flow
    funding_need: max(-closing_cash_before_funding, 0)
    equity_injection: funding_need * equity_share
    revolver_drawdown: funding_need * revolver_share
    cash_after_drawdown: closing_cash_before_funding + equity_injection + revolver_drawdown
    opening_revolver_balance: previous_year_closing_revolver_balance
    excess_cash_available_for_repayment: max(cash_after_drawdown - minimum_cash_balance, 0)
    revolver_repayment: min(excess_cash_available_for_repayment, opening_revolver_balance)
    revolver_balance: opening_revolver_balance + revolver_drawdown - revolver_repayment
    average_revolver_balance: (opening_revolver_balance + revolver_balance) / 2
    interest_expense: average_revolver_balance * revolver_interest_rate
    closing_cash_after_funding: cash_after_drawdown - revolver_repayment

balance_sheet:
  currency: RUB
  description: >
    Balance Sheet GPS. Строится на основе Cash Flow, CAPEX,
    Intangible Assets, Funding и P&L.
  assets:
    current_assets:
      cash:
        source: funding.closing_cash_after_funding
    non_current_assets:
      ppe:
        gross_ppe: cumulative_gpu_infra_capex + cumulative_datacenter_construction_capex + cumulative_office_capex
        accumulated_depreciation: cumulative_total_ppe_depreciation
        net_ppe: gross_ppe - accumulated_depreciation
      intangible_assets:
        gross_intangible_assets: cumulative_workplace_ai_ip_value + cumulative_contact_center_ai_ip_value
        accumulated_amortization: cumulative_total_ip_amortization
        net_intangible_assets: gross_intangible_assets - accumulated_amortization
    total_assets: cash + net_ppe + net_intangible_assets
  liabilities:
    debt:
      revolver_balance:
        source: funding.revolver_balance
    total_liabilities: revolver_balance
  equity:
    paid_in_capital: cumulative_equity_injection
    retained_earnings: previous_retained_earnings + net_income - dividends
    total_equity: paid_in_capital + retained_earnings
  balance_check: total_assets - total_liabilities - total_equity

investment_metrics:
  currency: RUB
  description: >
    DCF / Investment Metrics model GPS. Метрики считаются по monthly cash flow,
    annual report является агрегацией monthly rows.
  discount_rate:
    source: finance.valuation.discount_rate
  free_cash_flow: operating_cash_flow + investing_cash_flow
  discounted_cash_flow:
    monthly_discount_rate: (1 + annual_discount_rate) ** (1 / 12) - 1
    discount_factor: 1 / (1 + monthly_discount_rate) ** month_index
    discounted_fcf: free_cash_flow * discount_factor
    cumulative_discounted_fcf: cumulative sum of discounted_fcf
  valuation:
    npv: sum(discounted_fcf across monthly rows)
    irr: annualized IRR from monthly free_cash_flow series
  payback:
    simple_payback: first month_key where cumulative_free_cash_flow >= 0
    discounted_payback: first month_key where cumulative_discounted_fcf >= 0
  scenario_comparison:
    compare_by:
      - build_own_dc
      - rent_gpu_only
      - hybrid
    metrics:
      - npv
      - irr
      - simple_payback
      - discounted_payback
    wide_format: true
  return_metrics:
    description: >
      Метрики доходности и эффективности капитала GPS.
    roic:
      formula: nopat / average_invested_capital
      components:
        nopat: ebit * (1 - profit_tax_rate)
        invested_capital: net_ppe + net_intangible_assets
        average_invested_capital: (invested_capital_beginning + invested_capital_ending) / 2
    roe:
      formula: net_income / average_equity
      components:
        average_equity: (total_equity_beginning + total_equity_ending) / 2
    roa:
      formula: net_income / average_total_assets
      components:
        average_total_assets: (total_assets_beginning + total_assets_ending) / 2
    debt_to_equity: revolver_balance / total_equity
    net_debt: revolver_balance - cash
    net_debt_to_ebitda: net_debt / ebitda
    interest_coverage:
      formula: ebit / interest_expense
      fallback: N/A if interest_expense <= 0
  sensitivity_analysis:
    description: >
      Классический двухфакторный sensitivity analysis для оценки влияния
      производительности inference и коммерческой маржинальности на NPV.
    tables:
      npv_weighted_throughput_vs_contribution_margin:
        title:
          NPV sensitivity: weighted throughput vs contribution margin
        metric:
          name: npv
          description: >
            В ячейках таблицы показывается NPV проекта.
        row_factor:
          name: weighted_throughput
          description: >
            Изменение weighted_throughput отражает изменение средней производительности
            GPU с учетом model mix frontier / large / medium / small.
            Чем ниже weighted_throughput, тем больше GPU требуется для той же
            токеновой нагрузки.
          base_source: compute_model.weighted_throughput
          adjustment_type: multiplier
          min_multiplier: 0.75
          max_multiplier: 1.25
          step: 0.05
        column_factor:
          name: target_contribution_margin
          description: >
            Изменение target contribution margin отражает изменение целевой
            коммерческой маржи, которая применяется к pricing base.
          base_source: revenue.target_contribution_margin
          adjustment_type: multiplier
          min_multiplier: 0.80
          max_multiplier: 1.20
          step: 0.05
        calculation_logic:
          adjusted_weighted_throughput: base_weighted_throughput * weighted_throughput_multiplier
          adjusted_required_gpu: tokens_per_second / (adjusted_weighted_throughput * utilization) * peak_factor
          adjusted_target_contribution_margin: base_target_contribution_margin * contribution_margin_multiplier
          adjusted_revenue: pricing_base / (1 - adjusted_target_contribution_margin)
          adjusted_npv: NPV(adjusted_free_cash_flow_series, discount_rate)
        output:
          layout: matrix
          rows: weighted_throughput_multiplier
          columns: contribution_margin_multiplier
          values: npv

